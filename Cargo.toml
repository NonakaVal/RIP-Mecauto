[package]
name = "mecauto"
version = "1.0.0"
edition = "2021"
description = "MecAuto - software de gestão de mecânica automotiva"

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
image = "0.25"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
